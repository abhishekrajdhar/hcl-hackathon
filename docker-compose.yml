services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lpr-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lpr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lpr}
      POSTGRES_DB: ${POSTGRES_DB:-lpr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lpr} -d ${POSTGRES_DB:-lpr}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lpr-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lpr-api
    # Optional: settings all have safe defaults, so the stack boots without it.
    env_file:
      - path: ./backend/.env
        required: false
    # List form on purpose. `environment` OVERRIDES `env_file`, so writing
    # `OPENAI_API_KEY: ${OPENAI_API_KEY:-}` here clobbered the key set in
    # backend/.env with an empty string whenever the shell had none — the key
    # was present on disk and absent in the container. A bare name passes the
    # variable through only when the shell actually has it, leaving the .env
    # value intact otherwise.
    environment:
      # Container networking overrides whatever the .env says for hosts.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      # Redis backs the shared query-embedding cache.
      - EMBEDDING_CACHE_BACKEND=redis
      # NOTE: OPENAI_API_KEY is deliberately NOT listed here. Anything named in
      # `environment` overrides `env_file` — even a bare name with no value,
      # which resolves to null and wipes the key. backend/.env (gitignored) is
      # the single place the key lives.
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Live reload during development; drop this in production images.
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
